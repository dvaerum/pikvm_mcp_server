[package]
name = "pikvm-mcp-ipad-hid"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Module 5 (iPad-specific / HID recovery) of the pikvm-mcp-server Rust port: hid-recovery, hid-diagnosis, hid-mode, hid-latch-monitor family, ipad-unlock, ipad-app-ws, ipad-keys, health-check, desktop-e2e-metrics. Faithful port of src/pikvm/{hid-recovery,hid-diagnosis,hid-mode,hid-latch-*,ipad-*,health-check,desktop-e2e-metrics}.ts + src/hid-latch-monitor-main.ts. See docs/rust-port-plan.md."

[dependencies]
pikvm-mcp-foundation = { path = "../foundation" }
tokio = { version = "1", features = ["time", "rt", "sync", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
anyhow = "1"

[dev-dependencies]
tokio = { version = "1", features = ["time", "rt", "macros", "test-util", "sync", "process"] }
wiremock = "0.6"
