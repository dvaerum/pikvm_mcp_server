[package]
name = "pikvm-mcp-mover"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Module 4 (mover/HID orchestration) of the pikvm-mcp-server Rust port: move-to/curve-mover, click-at/click-verify, ballistics, auto-calibrate, the passive scale learner + its persistence, pointer acceleration, open-loop planning, cursor keepalive, slam. Faithful port of src/pikvm/{move-to,curve-mover,click-at,click-verify,ballistics,auto-calibrate,scale-learner,scale-persist,pointer-accel,open-loop-planner,cursor-keepalive,slam}.ts. See docs/rust-port-plan.md."

[dependencies]
pikvm-mcp-foundation = { path = "../foundation" }
pikvm-mcp-cursor-belief = { path = "../cursor-belief" }
pikvm-mcp-kvmd-client = { path = "../kvmd-client" }
pikvm-mcp-detection-vision = { path = "../detection-vision" }
pikvm-mcp-ipad-primitives = { path = "../ipad-primitives" }
pikvm-mcp-ipad-hid = { path = "../ipad-hid" }
tokio = { version = "1", features = ["fs", "net", "rt", "macros", "time"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rand = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
