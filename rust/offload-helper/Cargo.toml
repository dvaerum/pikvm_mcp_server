[package]
name = "pikvm-offload-helper"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Standalone binary for the cascade-inference offload feature (docs/cursor-offload-inference-design.md, task_d06561d91f58): runs on a general-purpose computer, connects OUT to a pikvm-mcp-server's /offload/ws, and processes cursor-detection AI batches remotely using the SAME real detection-vision inference code the server itself uses locally."

[[bin]]
name = "pikvm-offload-helper"
path = "src/main.rs"

[dependencies]
pikvm-mcp-foundation = { path = "../foundation" }
pikvm-mcp-detection-vision = { path = "../detection-vision" }
pikvm-mcp-offload-protocol = { path = "../offload-protocol" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
anyhow = "1"
sha2 = "0.10"
# Same version/feature spec as pikvm-mcp-detection-vision's own `ort` dep --
# deliberately kept in lockstep so Cargo unifies a single `ort` instance and
# `ort::session::Session` values built here are the same type detection-
# vision's own inference functions expect.
ort = { version = "2.0.0-rc.13", default-features = false, features = ["load-dynamic"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "test-util"] }
