[package]
name = "pikvm-mcp-offload-protocol"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Wire codec for the cursor-detection cascade-inference offload feature: shared Frame enum + encode/decode, used by both pikvm-mcp-server's axum WS route and the pikvm-offload-helper binary. Depends on pikvm-mcp-detection-vision directly to reuse the real CascadeResult/RawCrop types rather than duplicating them. See docs/cursor-offload-inference-design.md (task_d06561d91f58)."

[dependencies]
pikvm-mcp-detection-vision = { path = "../detection-vision" }
anyhow = "1"
