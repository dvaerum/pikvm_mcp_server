[package]
name = "pikvm-mcp-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Module 6 (MCP protocol surface) of the pikvm-mcp-server Rust port: cli, http-server, index (tool registry/dispatch), prompts. Faithful port of src/{cli,http-server,index}.ts + src/prompts/*.ts. See docs/rust-port-plan.md."

[[bin]]
name = "pikvm-mcp-server"
path = "src/main.rs"

[dependencies]
pikvm-mcp-foundation = { path = "../foundation" }
pikvm-mcp-kvmd-client = { path = "../kvmd-client" }
pikvm-mcp-detection-vision = { path = "../detection-vision" }
pikvm-mcp-mover = { path = "../mover" }
pikvm-mcp-ipad-hid = { path = "../ipad-hid" }
pikvm-mcp-ipad-primitives = { path = "../ipad-primitives" }
pikvm-mcp-offload-protocol = { path = "../offload-protocol" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
anyhow = "1"
rmcp = { version = "3.1", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
axum = { version = "0.8", features = ["ws"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
